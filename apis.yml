apis:
  - aid: mongodb-atlas:administration-api-v2
    name: MongoDB Atlas Administration API v2
    description: >-
      REST API for programmatically managing MongoDB Atlas organizations,
      projects, clusters, database users, network access, backups, alerts,
      and billing. Authenticates with HTTP Digest using public/private API key
      pairs or with OAuth 2.0 access tokens issued to Atlas service accounts.
    humanURL: https://www.mongodb.com/docs/atlas/api/atlas-admin-api/
