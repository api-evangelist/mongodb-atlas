aid: mongodb-atlas
name: MongoDB Atlas
description: >-
  MongoDB Atlas is a fully managed cloud database service for MongoDB,
  available on AWS, Google Cloud, and Microsoft Azure, with global clusters,
  automated backups, security, and integrated search, vector, and stream
  processing capabilities. The Atlas Administration API provides programmatic
  control over projects, clusters, users, network access, backups, and billing,
  and is paired with a Data API and Resource Policy APIs for full lifecycle
  management using HTTP Digest, API keys, or service account OAuth tokens.
